spring.datasource.url=jdbc:h2:mem:capstone;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.server.port=0
management.defaults.metrics.export.enabled=true

app.jwt.secret=VGVzdENhcHN0b25lU3VwZXJNYXJrZXRTZWNyZXRLZXlGb3JJbnRlZ3JhdGlvblRlc3Q=
app.jwt.expiration-ms=604800000
app.admin.bootstrap-token=TEST_ADMIN_BOOTSTRAP
app.auth.allow-admin-bootstrap-registration=true
app.uploads.directory=${java.io.tmpdir}/capstone-test-uploads

spring.application.name=supermarket-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/supermarket_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info

app.jwt.secret=${APP_JWT_SECRET:U3VwZXJNYXJrZXRDYXBzdG9uZVNlY3JldEtleUZvckRldmVsb3BtZW50T25seQ==}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
app.admin.bootstrap-token=${APP_ADMIN_BOOTSTRAP_TOKEN:CAPSTONE_ADMIN_SETUP}
app.uploads.directory=${APP_UPLOADS_DIR:uploads}
app.openai.api-key=${APP_OPENAI_API_KEY:}
app.openai.model=${APP_OPENAI_MODEL:gpt-4.1-mini}
app.openai.chat-completions-url=${APP_OPENAI_CHAT_COMPLETIONS_URL:https://api.openai.com/v1/chat/completions}
app.openai.timeout-ms=${APP_OPENAI_TIMEOUT_MS:15000}
app.ai.prompt-version=${APP_AI_PROMPT_VERSION:v1}

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
